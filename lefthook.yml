no_tty: true
output:
  - meta
  - summary
  - success
  - failure
  - execution
  - execution_out
  - execution_info

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,css,md,yml,yaml}"
      run: bun x oxfmt {staged_files}
      stage_fixed: true
    lint:
      run: bun x oxlint
    typecheck:
      run: bun x tsgo --build
    typos:
      run: mise exec -- typos --force-exclude {staged_files}
    markdownlint:
      glob: "*.md"
      run: bun x markdownlint-cli2 {staged_files}
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- actionlint {staged_files}

pre-push:
  commands:
    check:
      run: mise run check
    fallow:
      run: mise run fallow:audit -- --changed-since main
