# yaml-language-server: $schema=cases.schema.json
name: critic_review
cases:
  - name: selection_on_noise
    inputs:
      seed: selection_on_noise
    evaluators:
      - CriticToolWasCalled: get_project_overview
      - CriticToolWasCalled: load_skill
      - CriticToolArgsContain: {tool_name: load_skill, text: review-experiment}
      - CriticToolCalledSuccessfully: cancel_experiment
      - CriticReviewRecorded
      - CriticReviewMentionsAny:
          needles: [noise, variance, repeat, reproduction]
      - CriticDidNotCreateExperimentOrMeasurement

  - name: seed_hacking
