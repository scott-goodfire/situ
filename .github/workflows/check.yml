name: check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint, test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run check
        run: mise run check

      - name: Audit dependencies
        continue-on-error: true
        run: mise run audit
