[tools]
bun = "1.2.20"
node = "24.6.0"
python = "3.13.7"
uv = "0.9.7"

[tasks.update]
description = "Update TypeScript and Python workspace dependencies"
run = "./commands/update.sh"

[tasks.check]
description = "Run Python syntax checks and TypeScript typechecks"
run = "./commands/check.sh"

[tasks.evals]
description = "Run Almanac eval suites"
run = "./commands/evals.sh"

[tasks."evals:json"]
description = "Run Almanac eval suites and print JSON"
run = "./commands/evals-json.sh"

[tasks."dev:tui"]
description = "Run the TypeScript Ink TUI"
run = "./commands/dev-tui.sh"

[tasks."tui-ui:check"]
description = "Run typechecks for the Almanac TUI UI package"
run = "./commands/tui-ui-check.sh"

[tasks."tui:story"]
description = "Render an Almanac TUI story"
run = "./commands/tui-story.sh"

[tasks."tui:snapshots"]
description = "Capture text snapshots for Almanac TUI stories"
run = "./commands/tui-snapshots.sh"

[tasks.start]
description = "Start the local Almanac TUI"
run = "./commands/start.sh"

[tasks.web]
description = "Open the attach-only Almanac web monitor"
run = "./commands/web.sh"

[tasks."dev:web"]
description = "Open the attach-only Almanac web monitor"
run = "./commands/web.sh"

[tasks."web-ui:check"]
description = "Run typechecks for the Almanac web UI package"
run = "./commands/web-ui-check.sh"

[tasks.storybook]
description = "Run Storybook for the Almanac web UI"
run = "./commands/storybook.sh"

[tasks."storybook:build"]
description = "Build Storybook for the Almanac web UI"
run = "./commands/storybook-build.sh"

[tasks."storybook:screenshots"]
description = "Capture screenshots for every Storybook story"
run = "./commands/storybook-screenshots.sh"

[tasks."dev:harness"]
description = "Run the Python harness JSON-RPC stdio server"
run = "./commands/dev-harness.sh"

[tasks."example:toy"]
description = "Run the toy autoresearch vertical slice"
run = "./commands/dev-tui.sh"

[tasks."protocol:generate"]
description = "Generate JSON Schema and TypeScript protocol types"
run = "./commands/protocol-generate.sh"
