[tools]
bun = "1.3.14"
typos = "latest"
actionlint = "latest"
hyperfine = "latest"
ripgrep = "latest"

[tasks.update]
description = "Install Bun workspace dependencies and sync git hooks"
dir = "{{ config_root }}"
run = '''
bun install
bun x lefthook install
'''

[tasks.check]
description = "Run the root verification gate"
dir = "{{ config_root }}"
run = "bash scripts/check.sh"

[tasks.test]
description = "Run deterministic unit tests"
dir = "{{ config_root }}"
run = "bash scripts/test.sh"

[tasks.lint]
description = "Run oxlint across the repo"
dir = "{{ config_root }}"
run = 'bun x oxlint "$@"'

[tasks.format]
description = "Format the repo with oxfmt"
dir = "{{ config_root }}"
run = 'bun x oxfmt "$@"'

[tasks."format:check"]
description = "Verify the repo is formatted"
dir = "{{ config_root }}"
run = 'bun x oxfmt --check "$@"'

[tasks.audit]
description = "Audit installed packages for known vulnerabilities"
dir = "{{ config_root }}"
run = 'bun audit "$@"'

[tasks.markdownlint]
description = "Lint markdown structure with markdownlint-cli2"
dir = "{{ config_root }}"
run = 'bun x markdownlint-cli2 "$@"'

[tasks.typos]
description = "Spell-check source and prose with typos"
dir = "{{ config_root }}"
run = 'typos --force-exclude "$@"'

[tasks.actionlint]
description = "Lint GitHub Actions workflow YAML"
dir = "{{ config_root }}"
run = 'actionlint "$@"'

[tasks."lint:policies"]
description = "Lint the slim .agents meta layer"
dir = "{{ config_root }}"
run = "bash scripts/lint-policies.sh"

[tasks.fallow]
description = "Run Fallow codebase intelligence"
dir = "{{ config_root }}"
run = 'bun x fallow "$@"'

[tasks."fallow:fix"]
description = "Apply Fallow auto-fixes"
dir = "{{ config_root }}"
run = 'bun x fallow fix "$@"'

[tasks.app]
description = "Run the local Situ CLI"
dir = "{{ config_root }}"
run = '''
export SITU_REPO_PATH="${SITU_REPO_PATH:-$MISE_ORIGINAL_CWD}"
bun --filter=@situ/app run app "$@"
'''

[tasks.exec]
description = "Run a headless local Situ session"
dir = "{{ config_root }}"
run = '''
export SITU_REPO_PATH="${SITU_REPO_PATH:-$MISE_ORIGINAL_CWD}"
bun --filter=@situ/app run app -- exec "$@"
'''

[tasks.report]
description = "Generate a written report for a Situ session"
dir = "{{ config_root }}"
run = '''
export SITU_REPO_PATH="${SITU_REPO_PATH:-$MISE_ORIGINAL_CWD}"
bun --filter=@situ/app run app -- report "$@"
'''

[tasks.status]
description = "Summarize the latest local Situ session"
dir = "{{ config_root }}"
run = '''
export SITU_REPO_PATH="${SITU_REPO_PATH:-$MISE_ORIGINAL_CWD}"
bun --filter=@situ/app run app -- status "$@"
'''

[tasks.sessions]
description = "List local Situ sessions"
dir = "{{ config_root }}"
run = '''
export SITU_REPO_PATH="${SITU_REPO_PATH:-$MISE_ORIGINAL_CWD}"
bun --filter=@situ/app run app -- sessions "$@"
'''

[tasks.events]
description = "Print or follow local Situ session events"
dir = "{{ config_root }}"
run = '''
export SITU_REPO_PATH="${SITU_REPO_PATH:-$MISE_ORIGINAL_CWD}"
bun --filter=@situ/app run app -- events "$@"
'''

[tasks."app:check"]
description = "Typecheck the app project"
dir = "{{ config_root }}/projects/app"
run = "mise run check"

[tasks."app:test"]
description = "Run app project tests"
dir = "{{ config_root }}/projects/app"
run = "mise run test"

[tasks."app:common:check"]
description = "Typecheck @situ/common"
dir = "{{ config_root }}/projects/app/packages/common"
run = "mise run check"

[tasks."app:common:test"]
description = "Run @situ/common tests"
dir = "{{ config_root }}/projects/app/packages/common"
run = "mise run test"

[tasks."app:projects:check"]
description = "Typecheck @situ/projects"
dir = "{{ config_root }}/projects/app/packages/projects"
run = "mise run check"

[tasks."app:projects:test"]
description = "Run @situ/projects tests"
dir = "{{ config_root }}/projects/app/packages/projects"
run = "mise run test"

[tasks."app:tasks:check"]
description = "Typecheck @situ/tasks"
dir = "{{ config_root }}/projects/app/packages/tasks"
run = "mise run check"

[tasks."app:tasks:test"]
description = "Run @situ/tasks tests"
dir = "{{ config_root }}/projects/app/packages/tasks"
run = "mise run test"

[tasks."app:comments:check"]
description = "Typecheck @situ/comments"
dir = "{{ config_root }}/projects/app/packages/comments"
run = "mise run check"

[tasks."app:comments:test"]
description = "Run @situ/comments tests"
dir = "{{ config_root }}/projects/app/packages/comments"
run = "mise run test"

[tasks."app:notifications:check"]
description = "Typecheck @situ/notifications"
dir = "{{ config_root }}/projects/app/packages/notifications"
run = "mise run check"

[tasks."app:notifications:test"]
description = "Run @situ/notifications tests"
dir = "{{ config_root }}/projects/app/packages/notifications"
run = "mise run test"

[tasks."app:events:check"]
description = "Typecheck @situ/events"
dir = "{{ config_root }}/projects/app/packages/events"
run = "mise run check"

[tasks."app:events:test"]
description = "Run @situ/events tests"
dir = "{{ config_root }}/projects/app/packages/events"
run = "mise run test"

[tasks."db:generate"]
description = "Generate Drizzle migrations"
dir = "{{ config_root }}"
run = "bun --filter=@situ/app run db:generate"

[tasks."db:migrate"]
description = "Apply local SQLite migrations"
dir = "{{ config_root }}"
run = "bun --filter=@situ/app run db:migrate"

[tasks."release:build"]
description = "Build a local release tarball for the current platform"
dir = "{{ config_root }}"
run = "./config/scripts/build_release_assets.sh"
