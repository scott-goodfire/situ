<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="situ — local research workspace for Claude Managed Agent sessions"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c4652d'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fbfaf7'/%3E%3C/svg%3E"
    />
    <title>situ</title>
    <script>
      // Pre-paint theme application — must match the storage key + JSON shape
      // used by useDxTheme (web-ui). Avoids a flash before React mounts.
      (function () {
        let mode = "auto";
        try {
          const raw = localStorage.getItem("dx-theme");
          if (raw !== null) mode = JSON.parse(raw);
        } catch {}
        const resolved =
          mode === "auto"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : mode;
        document.documentElement.setAttribute("data-theme", resolved);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
