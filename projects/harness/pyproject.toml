[project]
name = "situ-harness"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = [
  "situ-protocol",
  "aiosqlite>=0.21.0",
  "dbos>=2.19.0",
  "logfire>=4.32.1",
  "pydantic-ai-backend[console]>=0.2.5",
  "pydantic-ai-slim[anthropic,dbos]>=1.89.1",
  "pydantic-settings>=2.0.0",
  "pydantic-ai-skills>=0.9.0",
  "pytest-asyncio>=1.3.0",
]

[project.scripts]
situ = "situ.harness.cli:main"
situ-harness-stdio = "situ.harness.stdio:main"

[tool.uv.sources]
situ-protocol = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["situ*"]
namespaces = true

[tool.setuptools.package-data]
"situ.harness.agent_skills" = ["**/*.md"]
