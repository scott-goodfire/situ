[project]
name = "almanac-harness"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = [
  "almanac-protocol",
  "dbos>=2.19.0",
  "logfire>=4.32.1",
  "pydantic-ai-backend[console]>=0.2.5",
  "pydantic-ai[dbos]>=1.89.1",
  "pydantic-settings>=2.0.0",
]

[project.scripts]
almanac = "almanac.harness.cli:main"
almanac-harness-stdio = "almanac.harness.stdio:main"

[tool.uv.sources]
almanac-protocol = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["almanac*"]
namespaces = true
