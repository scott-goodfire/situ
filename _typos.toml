[default.extend-words]
# Project / tool names that aren't in typos' dictionary
evalite = "evalite"
Evalite = "Evalite"
situ = "situ"
Situ = "Situ"
oxlint = "oxlint"
oxfmt = "oxfmt"
tsgo = "tsgo"
mitata = "mitata"

[files]
extend-exclude = [
  "bun.lock",
  "*.bin",
  "**/dist/**",
  "**/node_modules/**",
  # /examples/ holds pristine third-party fixtures (corpora, test sets, foreign
  # source) for laboratory runs — see .agents/skills/situ-run-laboratory-example.
  "examples/**",
  # Logbooks quote raw experiment output and misspelling examples.
  "logbooks/**",
]
